[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-tumor-5mc-5hmc"
version = "0.1.0"
description = "Regional and single-molecule analysis of nanopore 5mC and 5hmC in brain tumours"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Alexander Miller-Michlits"}, {name = "Yelyzaveta Miller-Michlits"}, {name = "Adelheid Woehrer"}]
dependencies = ["numpy>=1.23", "scipy>=1.9", "matplotlib>=3.6", "pysam>=0.22", "requests>=2.28", "reportlab>=4", "pypdf>=4"]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["black>=24", "pytest>=7"]

[project.scripts]
brain-5mc-5hmc = "brain_5mc_5hmc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brain_5mc_5hmc = ["*.json", "native/*.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]
